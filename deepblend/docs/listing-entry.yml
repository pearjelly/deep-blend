# The entry this repository submits to the DSH plugin list — THE SOURCE.
#
# SUBMITTED as [awesome-dsh-plugin#5545](https://github.com/awesome-dsh-plugin/awesome-dsh-plugin/pull/5545),
# on the branch `pearjelly:add-pearjelly-deep-blend`. The list's contributing guide requires the repository to
# be public and to carry the `dsh-plugin` topic; both are true as of 2026-09-21, and the submission gate and the
# `check` job are both green with the pull request MERGEABLE and unmerged.
#
# ─────────────────────────────────────────────────────────────────────────────
# THIS FILE IS THE ONLY PLACE THE ENTRY'S DATA IS WRITTEN
#
# The submission lives in a different repository, so it cannot be read by this one's suite — which is how the
# entry came to exist twice and be edited by hand in both. `tools/project-listing-entry.mjs` replaces that with
# a rule:
#
#   **everything from the first permitted key below is the PROJECTION — the exact bytes submitted — and that
#   tool is the only writer of it. Everything above that line is this repository's own analysis and is not
#   submitted at all.**
#
#   node deepblend/tools/project-listing-entry.mjs                # print the projection
#   node deepblend/tools/project-listing-entry.mjs --out <path>   # write it
#   node deepblend/tools/project-listing-entry.mjs --check-remote # is the submitted branch still this?
#
# So a change to the description is ONE edit here, and the submission is regenerated. `--check-remote` exits 0
# for "in sync", 1 for "the branch drifted", and 2 for "could not reach it" — three states, because an operator
# who cannot reach the list must be able to tell that apart from a drifted submission.
#
# The submission is ONE file whose name must equal `slugFor(url)`:
#
#   data/plugins/pearjelly__deep-blend--packages-deepblend-bundle.yml
#
# The permitted keys are exactly `url`, `name`, `category`, `description`, `tarball` — anything else is a
# validation failure, including a hand-written `npm:` key (the registry mapping is harvested automatically).
# `description.zh` is optional; only `description.en` is a contributor's responsibility.
#
# `contract/listing-entry.test.mjs` reads this file and checks every claim in it against the code: the URL's
# subdirectory exists here, the `#subname` matches it, the category is one of the ecosystem's ids, the numbers in
# the description are the numbers the repository actually has, and that the projection is this file's own bytes
# rather than a second copy somebody maintains. The checklist says descriptions are "read as a claim about your
# plugin, and checked against your code" — so the claim is checked here first.
#
# ─────────────────────────────────────────────────────────────────────────────
# THE PACKAGING DECISION, MEASURED
#
# Routes 2 and 3 need packages that can be installed, and this project ships five plus a bundle. What each option
# actually costs, read off the tree rather than estimated:
#
#   the five packages      52 source files, ~26 900 lines (contracts 7 450, host 8 261, provider-local 6 473,
#                          tool 2 746, ui 1 980, bundle 29)
#   imports BETWEEN them   16, and every one of them is `@deepblend/dsh-blender-contracts`. The packages are
#                          otherwise independent of each other — this is the number that decides the question.
#   the bundle's patch     names three packages (provider-local, host, ui) as three rows with distinct ids
#   the workspace          12 symlinks, all derived from source imports, asserted by `setup:check`
#   the test suite         imports the packages at 160 sites (contracts 56, host 40, provider-local 25, tool 19,
#                          ui 11, bundle 9)
#
# (a) PUBLISH ALL FIVE. No source change at all: five publishes, the `repository` field each already carries, and
#     `private: true` removed from each manifest. The four siblings then resolve from the registry like any other
#     dependency, and the bundle's exact pins (`0.1.0`) keep working. Cost: five packages to version in lockstep.
#
# (b) FLATTEN THE SOURCE TREE into one package. The product side is cheap — 16 imports to rewrite (all pointing at
#     contracts), the patch's three rows may keep their distinct ids while naming one package, and the workspace's
#     12 links become 1. The expensive part is the SUITE: 160 import sites across the tests, plus every fixture
#     that names a package directory. This is the only option that changes what a contributor sees.
#
# (c) VENDOR, AS A RELEASE ARTIFACT. Copy the five into the bundle at PACK TIME and ship the result — the tarball
#     route's requirement exactly. The repository keeps one copy of every fact (the doctrine that decides this),
#     the dev layout is untouched, and no test changes. Cost: a build step, and a bundle whose contents no longer
#     match its own directory.
#
# What the measurement says: the coupling inside the product is 16 imports, so (b) is not the expensive option it
# looks like from the file count — but its cost lands on the suite, and (a) and (c) both leave the repository as it
# is. (c) is the only one that satisfies the tarball route; (a) is the only one that satisfies the npm route without
# a build step.
#
# ─────────────────────────────────────────────────────────────────────────────
# (d) SELF-REFERENTIAL GIT SPECS — THE OPTION THIS ANALYSIS MISSED, AND THE ONE TAKEN
#
# The three options above all assume the siblings must come from somewhere else: a registry, a flattened package,
# or a vendored tarball. They do not. A package fetched with `github:owner/repo#path:…` is an ordinary dependency
# whose own dependencies pnpm resolves in turn — and a dependency may name the SAME repository:
#
#   "@deepblend/dsh-blender-host": "github:pearjelly/deep-blend#path:/packages/deepblend/host"
#
# MEASURED (pnpm 10.28.2, a scratch monorepo, then this one): pnpm resolves such a spec, fetches the subdirectory,
# and reads the package from it. One repository is fetched once per distinct spec and cached by commit, so the
# whole install is a handful of extractions of the same tarball rather than five registry packages.
#
# Why this is the cheapest of the four: no source change, no build step, no vendored copy, no test change, and the
# repository keeps ONE copy of every fact — the doctrine that decides this question. Why it is invisible in the
# list above: the analysis asked "where do the siblings come from", and the answer "from this same repository" is
# not a place, which is exactly why it was missed.
#
# WHAT IT COSTS. `dsh plugin add <local path>` writes a `link:` dependency, and pnpm does NOT install the
# dependencies of a linked package — so the developer paths (`npm run plugin:install`, the six local paths) are
# untouched by this change, and only a REMOTE install resolves the specs at all. That asymmetry is the whole reason
# the change is safe, and it is checked: `contract/plugin-install-path.test.mjs` drives the ecosystem command.
#
# ─────────────────────────────────────────────────────────────────────────────
# THE PRESET IS THE OTHER HALF OF "IT INSTALLS"
#
# The analysis above is about packages resolving. It missed a second gap with the same consequence: the sixteen
# tools in the description belong to an AGENT PRESET, and `dsh plugin add` does not write a user's preset root
# (`<DSH_HOME>/.agent-presets/`). A bundle that mounted only the Host composition would install, serve the
# workbench, and leave every session unable to render anything — the plugin would not do what its one-line
# description says, which is the checklist's first rejection cause.
#
# So the bundle mounts a deployer row (`@deepblend/dsh-blender-preset`) that ships the presets and installs them,
# which is the shape `dsh-expert-orchestrator` — an agent-preset plugin that IS on the list — already uses. The
# package carries its own copy of `deepblend/presets/` (a package can only ship what is inside it), generated by
# `tools/sync-plugin-presets.mjs` and compared byte for byte by `contract/plugin-preset-delivery.test.mjs`, so the
# second copy cannot be stale in a commit.
#
# ─────────────────────────────────────────────────────────────────────────────
# HOW THIS PLUGIN CAN BE INSTALLED, AND WHAT EACH ROUTE STILL NEEDS
#
# The list accepts three routes, and they are not interchangeable — each one has a different prerequisite. What
# each one measures, as of 2026-09-21, on a scratch `$DSH_HOME` rather than by inspection:
#
#   1. FROM SOURCE (what the entry's `url` implies, `github:owner/repo#path:…`) — WORKS.
#      `dsh plugin --profile web add 'github:pearjelly/deep-blend#path:/packages/deepblend/bundle'` installs in
#      12.0 s, `Packages: +7` (the bundle and its six siblings, all resolved through this same repository by
#      option (d) above). `dsh web` then serves `/deepblend/capabilities` HTTP 200 with `hostApiVersion 4`, and
#      the deployer row writes both presets into `<DSH_HOME>/.agent-presets/`, byte-identical to
#      `deepblend/presets/`. DSH's own `discoverPresets` reports `problem: null` for both.
#      It needed the repository to be PUBLIC: pnpm resolves a `github:` spec through an anonymous codeload
#      tarball, which answers 404 for a private repository — measured live, which is why no submission was made
#      while it was private.
#
#   2. FROM npm (the recommended route — prebuilt installs skip the build-approval step) — WORKS.
#      PUBLISHED 2026-09-21: all seven packages at `0.1.0` under the `@deepblend` scope, and the install was then
#      measured rather than assumed — `node tools/dsh-plugin-install-probe.mjs --spec
#      @deepblend/dsh-blender-bundle` on a scratch `$DSH_HOME` reports `packages pnpm fetched: 7`, the same four
#      composed rows, `/deepblend/capabilities` HTTP 200 with `hostApiVersion 4`, both presets deployed
#      byte-identical to `deepblend/presets/`, and `discoverPresets` reporting `problem: null` for both. That log
#      is `docs/probe-dsh-plugin-npm.log`.
#
#      THE SEVEN FROM THE REGISTRY, NOT FROM GIT, and that is not automatic: the repository's manifests carry
#      self-referential `github:` specs because the SOURCE route needs them, so publishing those as-is would have
#      made this route a registry install in name only — pnpm would have taken the bundle from the registry and
#      gone straight back to git for the six siblings. `tools/publish-packages.mjs` rewrites the specs to exact
#      versions in a staged copy at publish time, and the published manifests were read back to confirm it:
#      `npm view @deepblend/dsh-blender-bundle dependencies` answers six `0.1.0` pins and no git spec.
#
#      The mapping is harvested from the registry, never declared here: `probe-npm.mjs` finds the package and
#      verifies that ITS `repository` field points back at this repository, "or the two are not linked". That
#      field is `git+https://github.com/pearjelly/deep-blend.git` on all seven, and
#      `contract/listing-entry.test.mjs` asserts the condition against the entry's own url so a repository rename
#      cannot break the harvest silently.
#
#   3. FROM A TARBALL — WORKS, and it is the one route that needs no registry at all.
#      `tools/build-release-tarball.mjs` builds a SELF-CONTAINED artifact and attaches it to a GitHub release
#      under a VERSION-FREE asset name. Self-containment is npm's own `bundledDependencies`, not a bundler: the
#      six siblings are vendored into the tarball's `node_modules`, so `dsh plugin add <url>` reports
#      `Packages: +1` — it fetches the artifact and resolves nothing. Measured on a scratch home: the same 4
#      composed rows, `/deepblend/capabilities` HTTP 200, both presets deployed and `problem: null`.
#      The two rules this route carries, and why the second is a rule and not a nicety: the host must be GitHub
#      release hosting, and the ASSET NAME MUST BE VERSION-FREE (`…/releases/latest/download/NAME.tgz`), because
#      `latest/download/` takes the filename literally — a versioned name works on the day of submission and
#      404s on the next release. The market's own `probe-tarballs.mjs` warns about exactly that pattern, so the
#      naming rule is asserted by `contract/listing-entry.test.mjs` rather than left to whoever edits this file.
#
# So the decisions are not independent: making the repository public unblocked route 1, and route 3 is satisfied
# by the same self-referential git specs plus a vendored artifact. Route 2 is the only one still open, and it is
# open on an account rather than on the repository.
# ─────────────────────────────────────────────────────────────────────────────
# THE REVIEW'S OWN CHECKLIST, ANSWERED BEFORE IT IS ASKED
#
# `contributing.md` §"How submissions are reviewed" lists eight things a maintainer looks at.
# Most are satisfied by the contract layer. Two cannot be read off the entry, so they are
# written down here — and one of them is the item that could send this submission back.
#
#   (4) IS IT ALREADY COVERED. There IS a Blender entry on the list: `CheshireJCat/blender`,
#       category `tools` — "30 modeling/reconstruction skills, 13 runtime tools, and 26
#       deterministic helpers for reference fitting, rendering, validation, animation, and
#       portable export". Same DOMAIN, not the same plugin, and the guide's rule is
#       "whichever is better" rather than "whoever got here first". What this one is instead:
#       SceneSpec is the source of truth and the `.blend` is a compiled artifact; every
#       accepted change is ONE immutable revision published by a single `rename`; the visual
#       loop scores a rendered contact sheet from its PIXELS by a deterministic scorer the
#       model cannot write, and adopts a fix only if the score improved; a render above a
#       configured frame count does not start without an approval; and frames on disk are the
#       truth, so a delivery killed at frame 6 of 60 still finishes all 60. Five behaviours
#       the other entry does not have, each one asserted in this repository.
#
#   (7) IS IT A META-PACKAGE. This is the item that could send the submission back, and the
#       answer is the market's OWN second CI check rather than an argument:
#
#         `dsh.bundle` — fetched from your repo's `package.json` (root, or a `packages/` ·
#         `plugins/` · `apps/` subpackage). Declaring only `dsh.client` fails here.
#
#       MEASURED: exactly ONE package in this repository declares `dsh.bundle`, and it is the
#       one this entry points at. "List the plugins, not the bundle" therefore has no
#       alternative here — there is no other package the gate would accept. The six siblings
#       are internal modules of ONE product (the contracts, the Blender execution seam, the
#       business facade, the browser host half, the tool plane, the preset deployer), not
#       other entries, so the double-counting the rule exists to prevent cannot occur: this
#       entry points at no other entry's work. `contract/listing-entry.test.mjs` asserts both
#       halves — the uniqueness of `dsh.bundle`, and that the patch really mounts rows.
#
#       AND THE SHAPE IS ALREADY ON THE LIST, EIGHT TIMES. Read from the list's own
#       `data/plugins/*.yml` on 2026-09-21: 438 entries point at a monorepo SUBDIRECTORY, and
#       EIGHT of them point at `packages/bundle` — across six categories (`ui`, `security`,
#       `model`, `market`, `theme`, `session`). Two opened directly:
#
#         ayahunter/dsh-trail/packages/bundle      cordis.patch.yml (421 B) + package.json,
#                                                  no source at all — 1 row, 1 dependency
#         f-infinite-z/dsh-plugin-ops/packages/…   cordis.patch.yml (285 B) + manifest + src
#                                                  — 1 row, 1 dependency
#         THIS SUBMISSION                          cordis.patch.yml (11.9 KB) + lib/ + the
#                                                  manifest — 4 rows, 6 dependencies
#
#       Both accepted bundles are composition wrappers with a single row and a single
#       dependency. This one is strictly more than either by every one of those measures, and
#       its six dependencies are its own repository's internal modules rather than other
#       entries. (That is a READING of a list that grows, not a permanent fact — the command
#       is `grep -l '^url:.*tree/.*/packages/bundle$' data/plugins/*.yml` in a clone of
#       `awesome-dsh-plugin`.)
#
#       THE HONEST PART, because a maintainer may go and look: the patch's `config:` blocks
#       set 18 keys across four rows and NONE of them differs from the package's own schema
#       default. They make the composed configuration explicit in `--dump-config` rather than
#       change it. What the patch contributes is WHICH rows mount — and without it none of
#       them does, because a dependency list alone mounts nothing. So the bundle is the
#       composition, which is what a DSH Host Bundle IS (SPEC §4.1, §18).
#
#   (6) DOES THE PR TOUCH ANYTHING ELSE. No. One file added, nothing modified — checked
#       through the API rather than the diff, because the clone is shallow and has no merge
#       base.
#
# ─────────────────────────────────────────────────────────────────────────────
url: https://github.com/pearjelly/deep-blend/tree/main/packages/deepblend/bundle
name: pearjelly/deep-blend#bundle
# `#bundle` rather than a prettier `#deepblend`: the gate's own rule is `owner/repo#<last segment of the
# subdirectory the url points at>`, and its example is `…/packages/my-plugin` → `owner/repo#my-plugin`.
# A nicer label would have to come from renaming the directory, which the rest of the repository pins.
category: tools
# The release asset `tools/build-release-tarball.mjs` builds and `gh release` attaches. `latest/download/` plus a
# name with no version in it is what keeps this URL alive across releases; `--check` on that tool fails if a
# version ever appears in the asset name.
tarball: https://github.com/pearjelly/deep-blend/releases/latest/download/deepblend-bundle.tgz
description:
  # Quoted because it contains ": " — unquoted, the YAML parser trips on the colon.
  en: 'Render and iterate on Blender scenes from DSH: 16 tools for scene specs, previews, visual review and delivery renders, with immutable revisions and an approval gate.'
  zh: '在 DSH 里渲染并迭代 Blender 场景：16 个工具覆盖场景规格、预览、视觉评审与交付渲染，带不可变 revision 与审批闸门。'
