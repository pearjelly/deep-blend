# The entry this repository would submit to the DSH plugin list.
#
# NOT submitted: the list's contributing guide requires the repository to be public and to carry the
# `dsh-plugin` topic, and this one is still private — so the entry is prepared here, where its claims can be
# checked, rather than in a pull request that the CI gate would reject on the first line.
#
# The submission is ONE file whose name must equal `slugFor(url)`:
#
#   data/plugins/pearjelly__deep-blend--packages-deepblend-bundle.yml
#
# The permitted keys are exactly `url`, `name`, `category`, `description`, `tarball` — anything else is a
# validation failure, including a hand-written `npm:` key (the registry mapping is harvested automatically).
# `description.zh` is optional; only `description.en` is a contributor's responsibility.
#
# `contract/listing-entry.test.mjs` reads this file and checks every claim in it against the code: the URL's
# subdirectory exists here, the `#subname` matches it, the category is one of the ecosystem's ids, and the
# numbers in the description are the numbers the repository actually has. The checklist says descriptions are
# "read as a claim about your plugin, and checked against your code" — so the claim is checked here first.
#
# ─────────────────────────────────────────────────────────────────────────────
# HOW THIS PLUGIN CAN BE INSTALLED, AND WHAT EACH ROUTE STILL NEEDS
#
# The list accepts three routes, and they are not interchangeable — each one has a different prerequisite, so the
# submission is only as ready as the route chosen:
#
#   1. FROM SOURCE (what the entry's `url` implies, `github:owner/repo#path:…`)
#      Needs the repository to be PUBLIC. pnpm resolves a `github:` spec through an anonymous codeload tarball,
#      which answers 404 for a private repository — measured live, which is why no submission has been made. The
#      `#path:` form itself is documented and supported; nothing about this repository's layout is in the way.
#
#   2. FROM npm (the recommended route — prebuilt installs skip the build-approval step)
#      Needs PUBLISHED packages. The mapping is harvested from the registry, never declared here: `probe-npm.mjs`
#      finds the package and verifies that ITS `repository` field points back at this repository, "or the two are
#      not linked". The bundle pins four `@deepblend/dsh-blender-*` siblings that are not published, so this route
#      needs the packaging decision first: publish all five, flatten them into one self-contained package, or
#      vendor the siblings into the bundle.
#
#   3. FROM A TARBALL (for a repository that cannot be installed from source at all)
#      Needs a SELF-CONTAINED artifact, which is the same packaging decision as route 2 — a tarball of the bundle
#      alone would still need its four unpublished dependencies. Two rules if this route is chosen: the host must
#      be GitHub release hosting, and the ASSET NAME MUST BE VERSION-FREE (`…/releases/latest/download/NAME.tgz`),
#      because `latest/download/` takes the filename literally — a versioned name works on the day of submission
#      and 404s on the next release.
#
# So the four decisions are not independent: making the repository public unblocks route 1, and the packaging
# decision unblocks routes 2 and 3. Route 1 is the one that needs nothing else.
url: https://github.com/pearjelly/deep-blend/tree/main/packages/deepblend/bundle
name: pearjelly/deep-blend#bundle
# `#bundle` rather than a prettier `#deepblend`: the gate's own rule is `owner/repo#<last segment of the
# subdirectory the url points at>`, and its example is `…/packages/my-plugin` → `owner/repo#my-plugin`.
# A nicer label would have to come from renaming the directory, which the rest of the repository pins.
category: tools
description:
  # Quoted because it contains ": " — unquoted, the YAML parser trips on the colon.
  en: 'Render and iterate on Blender scenes from DSH: 16 tools for scene specs, previews, visual review and delivery renders, with immutable revisions and an approval gate.'
  zh: '在 DSH 里渲染并迭代 Blender 场景：16 个工具覆盖场景规格、预览、视觉评审与交付渲染，带不可变 revision 与审批闸门。'
