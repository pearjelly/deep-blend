<g fill="#A7B5C9" font-size="15"><text x="763" y="219">A recipe or your own model</text><text x="1107" y="219">Shape, materials and light</text><text x="763" y="425">Frames, video and provenance</text><text x="1107" y="425">Beauty, clay and references</text></g>
