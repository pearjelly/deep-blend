# CI for DeepBlend Studio.
#
# WHAT RUNS, AND WHAT DELIBERATELY DOES NOT
# -----------------------------------------
# This job runs the layer that needs no Blender: `deepblend/tests/run.mjs`. That is the
# layer a contributor breaks most often, and the one that says whether the repository can
# run its own tests at all.
#
# It carries NO COUNT of that layer, on purpose. This paragraph used to state how many
# files the layer had and how many checks and cases they reported, and it went on stating
# those figures for two milestones after they had all grown, because a figure in a comment
# nothing executes is a figure nothing re-reads. The run prints its own totals, and
# README.zh.md keeps the snapshot with its caveats; a second copy here would only be a second
# thing to forget. `contract/ci-workflow.test.mjs` fails on a number in this file.
#
# Separate Linux jobs run selected real Blender, Agent and browser inspections,
# and completed-frame delivery / render-selection / photography / bundle upload with their own time budget.
# The remaining blender-integration/*, composition/* and e2e/ui.e2e.mjs coverage
# stays in `bash deepblend/tests/run-all.sh`, including longer delivery renders and
# broader recovery flows. No online model calls are made by these CI jobs.
# Runtime archives are pinned; raw cached archives are rehashed before extraction.
#
# The DSH version is PINNED, not `latest`. `deepblend/docs/dsh-baseline.md` §1
# makes `0.1.5-rc.2` a compatibility anchor: SPEC §0.1 forbids following latest,
# because DSH is a Developer Preview and may break compatibility. An upgrade is a
# deliberate commit that changes this line and re-runs the full acceptance suite.
# `contract/toolchain-pins.test.mjs` asserts that this line, the baseline document
# and `tools/dsh-baseline.json` agree with the committed development lock.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  contract:
    name: Unit + contract (no Blender)
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # NOT DECORATION. `contract/render-job.test.mjs` compares the contracts' frame naming
      # against `deepblend_util.py` in a plain CPython — that module imports no bpy on
      # purpose, so the rule is checkable without launching Blender. Without Python the
      # file used to die on `spawnSync python3 ENOENT` at check 15 of 60 and lose the other
      # 45 (it now reports one named failure instead), so the prerequisite is stated here
      # rather than left to whichever image the runner happens to use.
      - name: Assert the Python 3 the contract layer needs
        run: python3 --version

      # npm ci uses deepblend/development/runtime/package-lock.json for the DSH
      # deployment, its subprocess/attachment providers, sharp and SDK tools.
      # setup also writes absolute deployment/toolchain paths and the dsh bin
      # directory to GitHub's environment files for later steps and the clone.
      - name: Install the locked development deployment and SDK tools
        run: node deepblend/tools/development.mjs setup --github-env

      - name: Assert the locked ecosystem package manager is executable
        run: pnpm --version

      # The step a fresh clone needs: `node_modules/` is git-ignored and holds
      # only symlinks, so without this every suite dies on ERR_MODULE_NOT_FOUND
      # before evaluating an assertion.
      - name: Link the workspace to that deployment
        run: node deepblend/tools/link-workspace.mjs

      # Linking and resolving are different claims. This re-checks the links
      # without writing, so a green line above cannot mask a drift below.
      - name: Assert the links are in place
        run: node deepblend/tools/link-workspace.mjs --check

      # The preset tree and its installer are exercised without touching `$DSH_HOME`: a
      # preset that is not installed is reported and passes, so this fails only when the
      # repository's own preset source is broken.
      - name: Assert the preset source is installable
        run: node deepblend/tools/install-presets.mjs --check

      - name: Unit + contract suites
        run: node deepblend/tests/run.mjs

      # THE ONE CLAIM AN OPEN-SOURCE PROJECT IS JUDGED ON, on every push.
      #
      # "A stranger can install this" was verified by `npm run verify:clone`, a command
      # somebody had to remember to run — measured once by hand when it was written, and
      # then for six rounds of changes nobody ran it at all. Everything above proves the
      # parts work in THIS checkout; this proves the documented four steps work in ORDER,
      # from a clone, against a `$DSH_HOME` that has never seen DeepBlend. It clones the
      # checkout itself, so it needs no network of its own, and it needs no pnpm: measured
      # with pnpm removed from PATH, `dsh --profile web --dump-config` still composes and
      # the walkthrough still passes (three of the four steps are plain Node).
      - name: The documented install path, from a clean clone
        run: node deepblend/tools/verify-clean-clone.mjs --source .

  linux-render-browser-smoke:
    name: Linux Blender + Agent + browser inspections
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - name: Prepare evidence directory
        run: node deepblend/tools/ci-evidence.mjs
      - name: Install the locked development deployment and SDK tools
        run: node deepblend/tools/development.mjs setup --github-env
      - name: Verify workspace links
        run: node deepblend/tools/link-workspace.mjs --check
      - name: Cache pinned raw runtime archives
        uses: actions/cache@v4
        with:
          path: .tools/ci/archives
          key: runtimes-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('deepblend/tools/ci-runtime-pins.json') }}
      - name: Download and verify fixed Linux runtimes
        id: runtimes
        run: node deepblend/tools/install-ci-runtimes.mjs > "$DEEPBLEND_CI_EVIDENCE/install.log" 2>&1
      - name: Recheck installed executables without changes
        run: node deepblend/tools/install-ci-runtimes.mjs --check > "$DEEPBLEND_CI_EVIDENCE/runtime-check.json" 2>&1
      - name: Prepare software graphics and Chrome sandbox
        id: graphics
        run: node deepblend/tools/prepare-ci-linux.mjs > "$DEEPBLEND_CI_EVIDENCE/graphics.log" 2>&1
      - name: Real Host beauty and clay inspections
        if: ${{ !cancelled() && steps.graphics.outcome == 'success' }}
        timeout-minutes: 5
        env:
          DEEPBLEND_DIAGNOSTIC_OUTPUT: ${{ runner.temp }}/deepblend-ci/diagnostic
        run: xvfb-run -a node deepblend/tests/blender-integration/diagnostic-preview.e2e.mjs > "$DEEPBLEND_CI_EVIDENCE/diagnostic.log" 2>&1
      - name: Real Agent inspection image attachments
        if: ${{ !cancelled() && steps.graphics.outcome == 'success' }}
        timeout-minutes: 5
        env:
          DEEPBLEND_TOOL_INSPECTION_OUTPUT: ${{ runner.temp }}/deepblend-ci/agent
        run: xvfb-run -a node deepblend/tests/composition/tool-plane-m1.e2e.mjs > "$DEEPBLEND_CI_EVIDENCE/agent.log" 2>&1
      - name: Real browser inspection workflow
        if: ${{ !cancelled() && steps.graphics.outcome == 'success' }}
        timeout-minutes: 5
        env:
          DEEPBLEND_E2E_ARTIFACTS: ${{ runner.temp }}/deepblend-ci/browser
        run: xvfb-run -a node deepblend/tests/e2e/inspection-ui.e2e.mjs > "$DEEPBLEND_CI_EVIDENCE/browser.log" 2>&1
      - name: Real handled-cup construction and dimensional edits
        if: ${{ !cancelled() && steps.graphics.outcome == 'success' }}
        timeout-minutes: 5
        env:
          DEEPBLEND_CUP_OUTPUT: ${{ runner.temp }}/deepblend-ci/cup
        run: xvfb-run -a node deepblend/tests/blender-integration/handled-cup.e2e.mjs > "$DEEPBLEND_CI_EVIDENCE/cup.log" 2>&1
      - name: Real handled-cup editor in Chrome
        if: ${{ !cancelled() && steps.graphics.outcome == 'success' }}
        timeout-minutes: 5
        env:
          DEEPBLEND_E2E_ARTIFACTS: ${{ runner.temp }}/deepblend-ci/cup-browser
        run: xvfb-run -a node deepblend/tests/e2e/handled-cup-ui.e2e.mjs > "$DEEPBLEND_CI_EVIDENCE/cup-browser.log" 2>&1
      - name: Public runtime conformance outside the checkout
        if: ${{ !cancelled() && steps.graphics.outcome == 'success' }}
        timeout-minutes: 8
        env:
          DEEPBLEND_RUNTIME_CONFORMANCE_OUTPUT: ${{ runner.temp }}/deepblend-ci/runtime-conformance
        run: xvfb-run -a node deepblend/tests/blender-integration/runtime-conformance.e2e.mjs > "$DEEPBLEND_CI_EVIDENCE/runtime-conformance.log" 2>&1
      - name: Real glTF/GLB/OBJ resource bundles and old revision rebuild
        if: ${{ !cancelled() && steps.graphics.outcome == 'success' }}
        timeout-minutes: 8
        env:
          DEEPBLEND_ASSET_BUNDLE_OUTPUT: ${{ runner.temp }}/deepblend-ci/asset-bundle
        run: xvfb-run -a node deepblend/tests/blender-integration/asset-bundle.e2e.mjs > "$DEEPBLEND_CI_EVIDENCE/asset-bundle.log" 2>&1
      - name: Real procedural UV surface grain and saved pixels
        if: ${{ !cancelled() && steps.graphics.outcome == 'success' }}
        timeout-minutes: 5
        env:
          DEEPBLEND_PROCEDURAL_UV_OUTPUT: ${{ runner.temp }}/deepblend-ci/procedural-uv
        run: env "$DEEPBLEND_BLENDER_PATH" --background --factory-startup --disable-autoexec --python-exit-code 1 --python deepblend/tests/blender-integration/procedural-uv.py > "$DEEPBLEND_CI_EVIDENCE/procedural-uv.log" 2>&1
      - name: Real image materials and pre-decode budget refusals
        if: ${{ !cancelled() && steps.graphics.outcome == 'success' }}
        timeout-minutes: 5
        env:
          DEEPBLEND_PBR_OUTPUT: ${{ runner.temp }}/deepblend-ci/image-materials
        run: env "$DEEPBLEND_BLENDER_PATH" --background --factory-startup --disable-autoexec --python-exit-code 1 --python deepblend/tests/blender-integration/image-materials.py > "$DEEPBLEND_CI_EVIDENCE/image-materials.log" 2>&1
      - name: Real HDR and EXR environment lighting
        if: ${{ !cancelled() && steps.graphics.outcome == 'success' }}
        timeout-minutes: 5
        env:
          DEEPBLEND_ENV_OUTPUT: ${{ runner.temp }}/deepblend-ci/environment
        run: env "$DEEPBLEND_BLENDER_PATH" --background --factory-startup --disable-autoexec --python-exit-code 1 --python deepblend/tests/blender-integration/environment.py > "$DEEPBLEND_CI_EVIDENCE/environment.log" 2>&1
      - name: Real procedural surface editor in Chrome
        if: ${{ !cancelled() && steps.graphics.outcome == 'success' }}
        timeout-minutes: 5
        env:
          DEEPBLEND_E2E_ARTIFACTS: ${{ runner.temp }}/deepblend-ci/material-browser
        run: xvfb-run -a node deepblend/tests/e2e/material-texture-ui.e2e.mjs > "$DEEPBLEND_CI_EVIDENCE/material-browser.log" 2>&1
      - name: Real recipe versions and native gallery defaults in Chrome
        if: ${{ !cancelled() && steps.graphics.outcome == 'success' }}
        timeout-minutes: 5
        env:
          DEEPBLEND_E2E_ARTIFACTS: ${{ runner.temp }}/deepblend-ci/recipe-browser
        run: xvfb-run -a node deepblend/tests/e2e/recipe-version-ui.e2e.mjs > "$DEEPBLEND_CI_EVIDENCE/recipe-browser.log" 2>&1
      - name: Real preview history and source revisions in Chrome
        if: ${{ !cancelled() && steps.graphics.outcome == 'success' }}
        timeout-minutes: 5
        env:
          DEEPBLEND_E2E_ARTIFACTS: ${{ runner.temp }}/deepblend-ci/preview-browser
        run: xvfb-run -a node deepblend/tests/e2e/preview-history-ui.e2e.mjs > "$DEEPBLEND_CI_EVIDENCE/preview-browser.log" 2>&1
      - name: Real independent Host preview publishers
        if: ${{ !cancelled() && steps.graphics.outcome == 'success' }}
        timeout-minutes: 5
        env:
          DEEPBLEND_ARTIFACT_CONCURRENCY_OUTPUT: ${{ runner.temp }}/deepblend-ci/artifact-concurrency
        run: xvfb-run -a node deepblend/tests/blender-integration/artifact-concurrency.e2e.mjs > "$DEEPBLEND_CI_EVIDENCE/artifact-concurrency.log" 2>&1
      - name: Real immutable review history across independent Hosts
        if: ${{ !cancelled() && steps.graphics.outcome == 'success' }}
        timeout-minutes: 5
        env:
          DEEPBLEND_REVIEW_HISTORY_OUTPUT: ${{ runner.temp }}/deepblend-ci/review-history
        run: xvfb-run -a node deepblend/tests/blender-integration/review-history.e2e.mjs > "$DEEPBLEND_CI_EVIDENCE/review-history.log" 2>&1
      - name: Preserve runtime facts, receipts, images and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-inspections-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/deepblend-ci
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: error

  linux-render-photography-browser:
    name: Linux delivery + editing + resource bundle upload
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - name: Prepare evidence directory
        run: node deepblend/tools/ci-evidence.mjs
      - name: Install the locked development deployment and SDK tools
        run: node deepblend/tools/development.mjs setup --github-env
      - name: Verify workspace links
        run: node deepblend/tools/link-workspace.mjs --check
      - name: Cache pinned raw runtime archives
        uses: actions/cache@v4
        with:
          path: .tools/ci/archives
          key: runtimes-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('deepblend/tools/ci-runtime-pins.json') }}
      - name: Download and verify fixed Linux runtimes
        id: runtimes
        run: node deepblend/tools/install-ci-runtimes.mjs > "$DEEPBLEND_CI_EVIDENCE/install.log" 2>&1
      - name: Recheck installed executables without changes
        run: node deepblend/tools/install-ci-runtimes.mjs --check > "$DEEPBLEND_CI_EVIDENCE/runtime-check.json" 2>&1
      - name: Prepare software graphics and Chrome sandbox
        id: graphics
        run: node deepblend/tools/prepare-ci-linux.mjs > "$DEEPBLEND_CI_EVIDENCE/graphics.log" 2>&1
      - name: Install delivery video tools
        run: sudo apt-get install -y --no-install-recommends ffmpeg > "$DEEPBLEND_CI_EVIDENCE/ffmpeg-install.log" 2>&1
      - name: Verify ffmpeg and ffprobe and retain their versions
        id: codecs
        run: ffmpeg -version > "$DEEPBLEND_CI_EVIDENCE/ffmpeg-version.log" 2>&1 && ffprobe -version > "$DEEPBLEND_CI_EVIDENCE/ffprobe-version.log" 2>&1
      - name: Real completed-frame delivery and native encoder cancellation
        if: ${{ !cancelled() && steps.codecs.outcome == 'success' }}
        timeout-minutes: 2
        env:
          DEEPBLEND_E2E_ARTIFACTS: ${{ runner.temp }}/deepblend-ci/complete-frame-delivery
        run: node deepblend/tests/e2e/complete-frame-delivery.e2e.mjs > "$DEEPBLEND_CI_EVIDENCE/complete-frame-delivery.log" 2>&1
      - name: Real render profile selection and revision-pinned delivery
        if: ${{ !cancelled() && steps.graphics.outcome == 'success' && steps.codecs.outcome == 'success' }}
        timeout-minutes: 5
        env:
          DEEPBLEND_E2E_ARTIFACTS: ${{ runner.temp }}/deepblend-ci/render-selection-browser
        run: xvfb-run -a node deepblend/tests/e2e/render-selection-ui.e2e.mjs > "$DEEPBLEND_CI_EVIDENCE/render-selection-browser.log" 2>&1
      - name: Real camera and light edits with saved inspection sources
        if: ${{ !cancelled() && steps.graphics.outcome == 'success' && steps.codecs.outcome == 'success' }}
        timeout-minutes: 5
        env:
          DEEPBLEND_E2E_ARTIFACTS: ${{ runner.temp }}/deepblend-ci/photography-browser
        run: xvfb-run -a node deepblend/tests/e2e/photography-ui.e2e.mjs > "$DEEPBLEND_CI_EVIDENCE/photography-browser.log" 2>&1
      - name: Real preview PNG saving without encoders
        if: ${{ !cancelled() && steps.graphics.outcome == 'success' }}
        timeout-minutes: 3
        env:
          DEEPBLEND_E2E_ARTIFACTS: ${{ runner.temp }}/deepblend-ci/png-download-browser
        run: xvfb-run -a node deepblend/tests/e2e/png-download-ui.e2e.mjs > "$DEEPBLEND_CI_EVIDENCE/png-download-browser.log" 2>&1
      - name: Real directory upload, cancellation recovery and native model application
        if: ${{ !cancelled() && steps.graphics.outcome == 'success' }}
        timeout-minutes: 10
        env:
          DEEPBLEND_E2E_ARTIFACTS: ${{ runner.temp }}/deepblend-ci/asset-bundle-upload-browser
        run: xvfb-run -a node deepblend/tests/e2e/asset-bundle-upload.e2e.mjs > "$DEEPBLEND_CI_EVIDENCE/asset-bundle-upload-browser.log" 2>&1
      - name: Preserve delivery and editing requests, native artifacts and shutdown evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-render-photography-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/deepblend-ci
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: error
