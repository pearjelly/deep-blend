# WHY THERE IS NO `order` KEY, when every preset the deployment ships declares one.
#
# The roster sorts by `order` and treats an absent one as `Number.POSITIVE_INFINITY`
# (`@deepseek-ai/dsh-agent-presets`, "ordered by id" is the tie-break), so this preset appears after the four
# built-ins and among any other unordered ones by id. That is the intended position for a plugin's preset, and it
# is the more robust spelling: a declared number would tie with a future built-in that picks the same one, while
# an absent one always follows the deployment's own. Measured by reading the sort, not assumed.
